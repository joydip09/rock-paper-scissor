<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissor</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1 class="title">Rock-Paper-Scissor</h1>
    <h4 class="subtitle">Play against the computer</h4>

    <div class="container">Your Choice:
        <button class="button" data-set="rock">Rock</button>
        <button class="button" data-set="paper">Paper</button>
        <button class="button" data-set="scissor">Scissor</button>
    </div> <br>

    <div class="result"></div> <br>
    <div class="verdict"></div> <br>

    <div class="score-board">
        <div class="label">You</div>
        <div class="label">Computer</div>
        <div class="score" id="user-score">0</div>
        <div class="score" id="comp-score">0</div>
    </div>

    <script src="index.js"></script>
</body>
</html>
